spring.application.name=FocusBuddy

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/focusbuddy
spring.datasource.username=focusbuddy_user
spring.datasource.password=focusbuddy_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Uploaded lecture PDFs
app.storage.upload-dir=uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB